name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
      - name: Install the dependencies of the app
        working-directory: app
        run: npm ci --omit=dev --legacy-peer-deps --no-audit --no-fund
      - name: Tests of the app
        # The app has fixed paths under /storage. Here it is an empty folder that goes away
        # with the runner. One file at a time, because they all use that same folder.
        run: |
          sudo install -d -o "$(id -u)" /storage
          node --test --test-concurrency=1 --test-force-exit app/tests/*.test.js
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install
        working-directory: contrib/mcp-server
        run: pip install -r requirements-dev.txt
      - name: Tests of the MCP server
        working-directory: contrib/mcp-server
        run: python -m pytest tests
